<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fog Reveal — WebGL 2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #ccc;
      font-family: system-ui, sans-serif;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 500;
    }
    .sub {
      margin-bottom: 1rem;
      font-size: 0.875rem;
      opacity: 0.8;
    }
    .canvas-wrap {
      position: relative;
      width: min(90vw, 900px);
      aspect-ratio: 16/9;
      max-height: 70vh;
      border: 1px solid #333;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      padding: 1rem;
      background: #1a1a1a;
      border-radius: 8px;
      max-width: 900px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }
    input[type="file"] {
      font-size: 0.8rem;
      color: #ccc;
    }
    input[type="range"] {
      width: 120px;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Fog Reveal</h1>
  <p class="sub">Move the cursor to create a mist trail that reveals the color city. Speed affects radius; when still, the reveal fades.</p>

  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Drawing (fog layer)</label>
      <input type="file" id="drawing" accept="image/*" />
    </div>
    <div class="control-group">
      <label>Color city (revealed)</label>
      <input type="file" id="colorCity" accept="image/*" />
    </div>
    <div class="control-group">
      <label>Reveal radius (base)</label>
      <input type="range" id="radius" min="0.02" max="0.15" step="0.01" value="0.06" />
      <span id="radiusVal">0.06</span>
    </div>
    <div class="control-group">
      <label>Fluidity</label>
      <input type="range" id="fluidity" min="0" max="2" step="0.1" value="0.8" />
      <span id="fluidityVal">0.8</span>
    </div>
    <div class="control-group">
      <label>Dissipation</label>
      <input type="range" id="dissipation" min="0.85" max="1" step="0.005" value="0.96" />
      <span id="dissipationVal">0.96</span>
    </div>
    <div class="control-group">
      <label>Tail</label>
      <input type="range" id="tail" min="0" max="2" step="0.1" value="1" />
      <span id="tailVal">1</span>
    </div>
    <div class="control-group">
      <label>Mist strength</label>
      <input type="range" id="mistStrength" min="0" max="1" step="0.05" value="0.6" />
      <span id="mistStrengthVal">0.6</span>
    </div>
  </div>

  <p class="hint">Drop your drawing and color city images above, or use the demo images in <code>demo/</code>.</p>

  <script type="module">
    import { createFogReveal } from "./fog-reveal.js";

    const canvas = document.getElementById("canvas");
    let fog = null;

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve(null);
          return;
        }
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    async function tryDemoImages() {
      try {
        const [drawingRes, colorRes] = await Promise.all([
          fetch("./demo/drawing.png").then((r) => (r.ok ? r.blob() : null)),
          fetch("./demo/color-city.png").then((r) => (r.ok ? r.blob() : null)),
        ]);
        if (drawingRes && colorRes) {
          const drawing = await loadImage(drawingRes);
          const colorCity = await loadImage(colorRes);
          if (drawing && colorCity && fog) {
            fog.setDrawing(drawing);
            fog.setColorCity(colorCity);
          }
        }
      } catch (_) {}
    }

    function init() {
      fog = createFogReveal(canvas, {
        revealRadius: parseFloat(document.getElementById("radius").value),
        revealSoftness: 0.02,
        dispersion: 2,
        dissipation: parseFloat(document.getElementById("dissipation").value),
        addAmount: 0.2,
        fluidity: parseFloat(document.getElementById("fluidity").value),
        tail: parseFloat(document.getElementById("tail").value),
        mistStrength: parseFloat(document.getElementById("mistStrength").value),
      });

      tryDemoImages();

      document.getElementById("drawing").addEventListener("change", async (e) => {
        const img = await loadImage(e.target.files[0]);
        if (img && fog) fog.setDrawing(img);
      });
      document.getElementById("colorCity").addEventListener("change", async (e) => {
        const img = await loadImage(e.target.files[0]);
        if (img && fog) fog.setColorCity(img);
      });

      document.getElementById("radius").addEventListener("input", (e) => {
        const v = parseFloat(e.target.value);
        document.getElementById("radiusVal").textContent = v.toFixed(2);
        if (fog) fog.opts.revealRadius = v;
      });
      document.getElementById("fluidity").addEventListener("input", (e) => {
        const v = parseFloat(e.target.value);
        document.getElementById("fluidityVal").textContent = v;
        if (fog) fog.opts.fluidity = v;
      });
      document.getElementById("dissipation").addEventListener("input", (e) => {
        const v = parseFloat(e.target.value);
        document.getElementById("dissipationVal").textContent = v;
        if (fog) fog.opts.dissipation = v;
      });
      document.getElementById("tail").addEventListener("input", (e) => {
        const v = parseFloat(e.target.value);
        document.getElementById("tailVal").textContent = v;
        if (fog) fog.opts.tail = v;
      });
      document.getElementById("mistStrength").addEventListener("input", (e) => {
        const v = parseFloat(e.target.value);
        document.getElementById("mistStrengthVal").textContent = v;
        if (fog) fog.opts.mistStrength = v;
      });
    }

    init();
  </script>
</body>
</html>
