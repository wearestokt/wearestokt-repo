<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The next big idea</title>
</head>
<body style="margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.6; color: #1a1a1a; background: #f5f5f5;">
  <div style="max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    
    <!-- Header -->
    <div style="padding: 24px 24px 16px; border-bottom: 1px solid #eee;">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600;">The next big idea</h1>
      <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: #333;">{{from_name}} found the easter egg on your website. Take it seriously, this might be the needle you were looking for in the haystack.</p>
    </div>

    <!-- Sender info -->
    <div style="padding: 20px 24px; border-bottom: 1px solid #eee;">
      <p style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888;">From</p>
      <p style="margin: 0; font-size: 16px;">
        <strong>{{from_name}}</strong><br>
        <a href="mailto:{{from_email}}" style="color: #0066cc; text-decoration: none;">{{from_email}}</a>
      </p>
    </div>

    <!-- Message -->
    <div style="padding: 20px 24px; border-bottom: 1px solid #eee;">
      <p style="margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888;">Message</p>
      <p style="margin: 0; white-space: pre-wrap;">{{message}}</p>
    </div>

    <!-- Drawing -->
    <div style="padding: 20px 24px;">
      <p style="margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888;">Drawing</p>
      <img src="{{drawing}}" alt="Napkin drawing" style="max-width: 100%; height: auto; border-radius: 8px; display: block; background: #faf8f5;" />
    </div>

    <!-- Footer -->
    <div style="padding: 16px 24px; background: #fafafa; font-size: 12px; color: #888;">
      Sent via Napkin Drawing
    </div>

  </div>
</body>
</html>
